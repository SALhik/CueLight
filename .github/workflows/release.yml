name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to (re)build the zip for"
        required: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Build end-user zip
        # tracked files at the tag, minus tests and dev config
        run: |
          DIST="CueLight-$TAG"
          mkdir -p "dist/$DIST"
          git archive HEAD | tar -x -C "dist/$DIST"
          rm -rf "dist/$DIST/tests" "dist/$DIST/.github" \
            "dist/$DIST/CLAUDE.md" "dist/$DIST/ruff.toml" \
            "dist/$DIST/pytest.ini" "dist/$DIST/.gitignore"
          cd dist && zip -qr "$DIST.zip" "$DIST"
          unzip -l "$DIST.zip"
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/CueLight-$TAG.zip" --clobber
