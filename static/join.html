<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CueLight — Join</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/join.css">
</head>
<body>
  <div class="join-card">
    <h1>CueLight</h1>
    <p>Enter your position name to join the show.</p>
    <input type="text" id="labelInput" placeholder="e.g. LX, SND, Fly" maxlength="16" autofocus>
    <div class="password-field" id="passwordField">
      <input type="text" id="passwordInput" placeholder="Password">
    </div>
    <button class="btn-join" id="joinBtn">Join</button>
    <div class="error" id="errorMsg"></div>
    <div class="or-caller">
      <button class="btn-caller-link" id="callerLink">Open as Caller instead</button>
    </div>
  </div>
  <script src="/static/js/join.js"></script>
</body>
</html>
