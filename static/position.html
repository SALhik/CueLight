<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CueLight — Position</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/position.css">
</head>
<body>
  <div class="header-strip" id="headerStrip">
    <span class="scene" id="sceneDisplay"></span>
    <span class="cue-num" id="cueDisplay"></span>
  </div>
  <div class="cue-note" id="noteDisplay"></div>
  <div class="buttons-area">
    <button class="btn-standby" id="standbyBtn">STANDBY</button>
    <button class="btn-go" id="goBtn">GO</button>
  </div>
  <!-- Problem panel sits in the layout flow: opening it shrinks the cue
       buttons instead of covering them, so STANDBY/GO stay tappable. -->
  <div class="problem-panel" id="problemPanel">
    <div class="problem-row">
      <button class="problem-preset" data-msg="NOT READY">NOT READY</button>
      <button class="problem-preset" data-msg="PROP ISSUE">PROP ISSUE</button>
      <button class="problem-preset" data-msg="NEED SM">NEED SM</button>
    </div>
    <div class="problem-row">
      <input type="text" id="problemInput" maxlength="60" placeholder="Optional message…">
      <button class="problem-raise" id="problemRaiseBtn">RAISE</button>
    </div>
    <button class="problem-clear" id="problemClearBtn">CLEAR PROBLEM</button>
  </div>
  <div class="caller-warning" id="callerWarning">Caller disconnected — waiting…</div>
  <div class="bottom-bezel">
    <div class="bezel-left">
      <button class="btn-reset" id="resetBtn">RESET</button>
      <button class="btn-dim" id="dimBtn">DIM</button>
      <button class="btn-dim" id="alertBtn">ALERT</button>
      <button class="btn-problem" id="problemBtn">PROBLEM</button>
    </div>
    <div class="bezel-right">
      <span class="label-display" id="labelDisplay"></span>
      <span class="health-dot" id="healthDot"></span>
    </div>
  </div>
  <div class="show-banner" id="showBanner">SHOW STARTED</div>
  <div class="flash-overlay" id="flashOverlay">FLASH CHECK<br>TAP TO CONFIRM</div>
  <div class="lock-overlay" id="lockOverlay">LOCKED</div>
  <div class="dim-overlay" id="dimOverlay"></div>
  <script src="/static/js/keepawake.js"></script>
  <script src="/static/js/position.js"></script>
</body>
</html>
