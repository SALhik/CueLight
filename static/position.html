<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CueLight — Position</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/position.css">
</head>
<body>
  <div class="header-strip" id="headerStrip">
    <span class="scene" id="sceneDisplay"></span>
    <span class="cue-num" id="cueDisplay"></span>
  </div>
  <div class="cue-note" id="noteDisplay"></div>
  <div class="buttons-area">
    <button class="btn-standby" id="standbyBtn">STANDBY</button>
    <button class="btn-go" id="goBtn">GO</button>
  </div>
  <div class="caller-warning" id="callerWarning">Caller disconnected — waiting…</div>
  <div class="bottom-bezel">
    <div class="bezel-left">
      <button class="btn-reset" id="resetBtn">RESET</button>
      <button class="btn-dim" id="dimBtn">DIM</button>
      <button class="btn-dim" id="alertBtn">ALERT</button>
      <button class="btn-attention" id="attentionBtn" aria-label="Report a problem" title="Report a problem">⚠</button>
    </div>
    <div class="bezel-right">
      <span class="label-display" id="labelDisplay"></span>
      <span class="health-dot" id="healthDot"></span>
    </div>
  </div>
  <div class="flash-overlay" id="flashOverlay">FLASH CHECK<br>TAP TO CONFIRM</div>
  <div class="lock-overlay" id="lockOverlay">
    <span>LOCKED</span>
    <button class="lock-attention" id="lockAttentionBtn">⚠ REPORT PROBLEM</button>
  </div>
  <div class="attention-panel" id="attentionPanel">
    <div class="attention-box">
      <div class="attention-title" id="attentionTitle">Report a problem to the caller</div>
      <div class="attention-presets" id="attentionPresets">
        <button class="preset-chip">NOT READY</button>
        <button class="preset-chip">TECH PROBLEM</button>
        <button class="preset-chip">NEED HELP</button>
      </div>
      <input type="text" id="attentionInput" maxlength="120" placeholder="Optional message…">
      <div class="attention-actions">
        <button id="attentionSendBtn">RAISE ⚠</button>
        <button id="attentionWithdrawBtn" class="hidden">WITHDRAW</button>
        <button id="attentionCancelBtn">CANCEL</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="dim-overlay" id="dimOverlay"></div>
  <script src="/static/js/keepawake.js"></script>
  <script src="/static/js/position.js"></script>
</body>
</html>
