<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueLight — Editor</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
  <div class="editor-header">
    <h1>Editor</h1>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="showfiles">Showfiles</button>
      <button class="tab-btn" data-tab="patches">OSC Patches</button>
    </div>
  </div>

  <!-- Showfile tab -->
  <div class="tab-panel active" id="tab-showfiles">
    <div class="file-bar">
      <select id="fileSelect"></select>
      <button id="loadBtn">Load</button>
      <span style="color:var(--text-dim)">or</span>
      <input type="text" id="newFilename" placeholder="new_show.json" size="20">
      <button id="newBtn">New</button>
    </div>

    <div class="meta-fields">
      <div><label>Show name: <input type="text" id="showName" size="30"></label></div>
      <div><label>Version: <input type="number" id="showVersion" value="1" min="1" size="4"></label></div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:60px">Seq</th>
          <th style="width:80px">Scene</th>
          <th>Targets (position:cue, …)</th>
          <th>Note</th>
          <th style="width:50px"></th>
        </tr>
      </thead>
      <tbody id="cueBody"></tbody>
    </table>

    <div class="btn-row">
      <button class="btn-add" id="addCueBtn">+ Add cue</button>
      <button class="btn-save" id="saveBtn">Save</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- Patch tab -->
  <div class="tab-panel" id="tab-patches">
    <div class="file-bar">
      <select id="patchFileSelect"></select>
      <button id="patchLoadBtn">Load</button>
      <span style="color:var(--text-dim)">or</span>
      <input type="text" id="newPatchFilename" placeholder="venue.json" size="20">
      <button id="patchNewBtn">New</button>
    </div>

    <div class="meta-fields">
      <div><label>Patch name: <input type="text" id="patchName" size="30"></label></div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:100px">Name</th>
          <th style="width:100px">Preset</th>
          <th style="width:120px">IP</th>
          <th style="width:60px">Port</th>
          <th style="width:60px">Proto</th>
          <th>GO Template</th>
          <th style="width:100px">GO Args</th>
          <th style="width:100px">Ping</th>
          <th style="width:50px">Reply</th>
          <th style="width:50px">Test</th>
          <th style="width:40px"></th>
        </tr>
      </thead>
      <tbody id="deviceBody"></tbody>
    </table>

    <div class="btn-row">
      <button class="btn-add" id="addDeviceBtn">+ Add device</button>
      <button class="btn-save" id="patchSaveBtn">Save</button>
    </div>
    <div class="status-msg" id="patchStatusMsg"></div>
  </div>

  <script src="/static/js/editor.js"></script>
</body>
</html>
