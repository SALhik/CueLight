<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CueLight — Caller</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/caller.css">
</head>
<body>
  <!-- Portrait warning -->
  <div class="portrait-overlay" id="portraitOverlay">Please rotate to landscape.</div>

  <!-- Join info screen (shown when no positions + toggled) -->
  <div class="join-info-screen" id="joinInfoScreen" style="display:none">
    <img class="qr-img" id="qrImg" width="250" height="250" alt="QR">
    <div class="url-text" id="urlText"></div>
    <div class="pw-text" id="pwText" style="display:none"></div>
  </div>

  <!-- Warning banner for missing positions -->
  <div class="warning-banner" id="warningBanner"></div>

  <!-- Main grid -->
  <div class="grid-area">
    <div class="positions-grid" id="positionsGrid"></div>
    <div class="master-col">
      <div class="master-header">MASTER</div>
      <button class="col-btn btn-master-standby" id="masterStandby">STANDBY<br>ARMED</button>
      <button class="col-btn btn-master-reset" id="masterReset">RESET<br>ARMED</button>
      <button class="col-btn btn-master-go" id="masterGo">GO<br>ARMED</button>
    </div>
  </div>

  <!-- Showfile transport -->
  <div class="transport-row" id="transportRow">
    <div class="cue-display">
      <span class="scene-label" id="transportScene"></span>
      <span class="cue-label" id="transportCue"></span>
    </div>
    <button id="prevCueBtn">◀ PREV</button>
    <button class="btn-pause" id="pauseBtn">PAUSE</button>
    <button id="jumpCueBtn">JUMP</button>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <button class="btn-lock" id="lockBtn">LOCK</button>
    <button id="resetAllBtn">RESET ALL</button>
    <button id="exitBtn">EXIT</button>
    <button id="settingsBtn">SETTINGS</button>
    <span class="spacer"></span>
    <button class="join-toggle" id="showJoinInfo">Show join info</button>
    <button class="join-toggle" id="hideJoinInfo" style="display:none">Hide join info</button>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <button class="close-btn" id="closeSettings">✕</button>
      <h2>Settings</h2>

      <h3>Health & Latency</h3>
      <ul class="health-list" id="healthList"></ul>

      <h3>Showfile</h3>
      <div id="showfileSection">
        <div class="field">
          <label id="currentShowfile">No showfile loaded</label>
        </div>
        <div class="field">
          <select id="showfileSelect" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:13px;"></select>
          <button class="modal-btn" id="loadShowfileBtn">Load</button>
          <button class="modal-btn" id="unloadShowfileBtn">Unload</button>
        </div>
        <div class="field">
          <button class="modal-btn" id="editShowfileBtn">Edit showfile…</button>
        </div>
      </div>

      <h3>Network</h3>
      <div class="field">
        <label id="networkInfo">Loading…</label>
      </div>

      <h3>Security</h3>
      <div class="field">
        <label>Password</label>
        <input type="checkbox" id="pwToggle">
      </div>
      <div class="field" id="pwValueField" style="display:none">
        <input type="text" id="pwInput" placeholder="Enter password">
        <button class="modal-btn" id="pwSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Jump-to-cue modal -->
  <div class="modal-overlay" id="jumpModal">
    <div class="modal">
      <button class="close-btn" id="closeJump">✕</button>
      <h2>Jump to Cue</h2>
      <div class="cue-list" id="cueList"></div>
    </div>
  </div>

  <!-- Rename/Remove modal -->
  <div class="modal-overlay" id="renameModal">
    <div class="modal rename-modal">
      <button class="close-btn" id="closeRename">✕</button>
      <h2>Edit Position</h2>
      <input type="text" id="renameInput" maxlength="16" placeholder="New label">
      <div class="rename-error" id="renameError" style="color:var(--red-bright);font-size:13px;margin:4px 0;display:none"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="modal-btn" id="renameSaveBtn" style="flex:1">Rename</button>
        <button class="modal-btn" id="removePositionBtn" style="flex:1;background:var(--red-dim);color:var(--red-bright)">Remove</button>
      </div>
    </div>
  </div>

  <div class="lock-overlay" id="lockOverlay">SYSTEM LOCKED</div>
  <script src="/static/js/caller.js"></script>
</body>
</html>
